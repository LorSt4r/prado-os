[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "prado-os"
version = "0.2.0"
description = "Autonomous, cross-platform academic workflow engine for Moodle and PRADO UGR"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "AGPL-3.0-or-later" }
authors = [
    { name = "Lorenzo Vasile", email = "lorenzovasile07@gmail.com" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
    "Operating System :: OS Independent",
    "Topic :: Education",
    "Topic :: Utilities",
]
dependencies = [
    "requests>=2.28.0",
    "beautifulsoup4>=4.11.0",
    "keyring>=24.0.0",
    "pyyaml>=6.0",
    "cryptography>=41.0.0",
    "urllib3>=1.26.0",
    "pystray>=0.19.5",
    "pillow>=10.0.0",
]

[project.optional-dependencies]
gui = [
    "pywebview>=5.0",
]
dev = [
    "pytest>=7.0.0",
    "pyinstaller>=6.0.0",
]

[project.scripts]
prado = "prado.cli:main"
prado-app = "prado.ui.tray:run_tray_app"
prado-gui = "prado.ui.tray:run_tray_app"

[project.gui-scripts]
prado-os = "prado.ui.tray:run_tray_app"

[tool.hatch.build.targets.wheel]
packages = ["src/prado"]
