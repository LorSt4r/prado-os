name: Cross-Platform CI (Linux, macOS, Windows)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test-matrix:
    name: Test on ${{ matrix.os }} (Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install PradoOS and dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run Live Network & Environment Health Check (prado doctor --json)
        run: |
          prado doctor --json || true

      - name: Verify Self-Bootstrapping Installer on Windows (install.ps1)
        if: runner.os == 'Windows'
        shell: powershell
        env:
          PRADO_NO_INTERACTIVE: "1"
        run: |
          .\install.ps1
          & "$HOME\.local\bin\prado.cmd" --version

      - name: Verify Self-Bootstrapping Installer on POSIX (install.sh)
        if: runner.os != 'Windows'
        shell: bash
        env:
          PRADO_NO_INTERACTIVE: "1"
        run: |
          bash ./install.sh
          "$HOME/.local/bin/prado" --version

      - name: Live Zero-Mock OS & UGR Server Integration Suite (test_live_real.py)
        shell: bash
        env:
          PRADO_NO_INTERACTIVE: "1"
          PRADO_LIVE_E2E: "1"
        run: |
          pytest tests/e2e/test_live_real.py -v

      - name: Run Full Pytest Suite (Unit + Integration + E2E)
        run: |
          pytest -q
