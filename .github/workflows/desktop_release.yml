name: Build Desktop Releases

on:
  push:
    tags:
      - 'v*'
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

env:
  PYTHONUTF8: "1"

jobs:
  build-desktop:
    name: Build Standalone Desktop App (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            artifact_name: PradoOS-macos.zip
            artifact_path: dist/PradoOS-macos.zip
          - os: windows-latest
            artifact_name: PradoOS-windows.zip
            artifact_path: dist/PradoOS-windows.zip
          - os: ubuntu-latest
            artifact_name: PradoOS-linux.tar.gz
            artifact_path: dist/PradoOS-linux.tar.gz

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libayatana-appindicator3-dev gir1.2-ayatanaappindicator3-0.1

      - name: Install project dependencies & dev tools
        run: |
          uv sync --all-extras

      - name: Build Standalone Application
        shell: bash
        run: |
          uv run python scripts/build_desktop.py

      - name: Package Linux release archive
        if: runner.os == 'Linux'
        shell: bash
        run: |
          if [ -d "dist/PradoOS" ]; then
            tar -czf dist/PradoOS-linux.tar.gz -C dist PradoOS
          elif [ -f "dist/PradoOS" ]; then
            tar -czf dist/PradoOS-linux.tar.gz -C dist PradoOS
          fi

      - name: Upload Release Asset to GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'release'
        with:
          files: ${{ matrix.artifact_path }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Build Artifact (for workflow_dispatch)
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_path }}
          if-no-files-found: ignore
