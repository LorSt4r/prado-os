name: Build Desktop Releases

on:
  push:
    branches: [ feat/desktop-tray ]
    tags:
      - 'v*'
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

env:
  PYTHONUTF8: "1"

jobs:
  build-desktop:
    name: Build Standalone Desktop App (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            artifact_name: PradoOS-macos.zip
            artifact_path: dist/PradoOS-macos.zip
          - os: windows-latest
            artifact_name: PradoOS-windows
            artifact_path: |
              dist/PradoOS-Setup.exe
              dist/PradoOS-windows.zip
          - os: ubuntu-latest
            artifact_name: PradoOS-linux.tar.gz
            artifact_path: dist/PradoOS-linux.tar.gz

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libayatana-appindicator3-dev gir1.2-ayatanaappindicator3-0.1

      - name: Install project dependencies & dev tools
        run: |
          uv sync --all-extras

      - name: Build Standalone Application
        shell: bash
        run: |
          uv run python scripts/build_desktop.py

      - name: Verify Windows Bundle, GUI Runtime & Build Setup Installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Test-Path "dist/PradoOS/PradoOS.exe")) { throw "Missing dist/PradoOS/PradoOS.exe" }
          if (-not (Test-Path "dist/PradoOS-windows.zip")) { throw "Missing dist/PradoOS-windows.zip" }
          $wv = Get-ChildItem -Path "dist/PradoOS" -Filter "WebView2Loader.dll" -Recurse
          if (-not $wv) { throw "Missing WebView2Loader.dll in dist/PradoOS" }
          Write-Host "Verified Windows bundle and WebView2Loader.dll: $($wv.FullName)"

          $proc = Start-Process -FilePath "dist/PradoOS/PradoOS.exe" -ArgumentList "--diagnose-gui=dist/win_gui_diag.json" -Wait -PassThru
          if (Test-Path "dist/win_gui_diag.json") {
            Get-Content "dist/win_gui_diag.json"
            $diag = Get-Content "dist/win_gui_diag.json" -Raw | ConvertFrom-Json
            if (-not $diag.ok) { throw "Windows GUI diagnostics failed! See dist/win_gui_diag.json" }
          } else {
            throw "Missing dist/win_gui_diag.json from PradoOS.exe --diagnose-gui"
          }
          if ($proc.ExitCode -ne 0) { throw "PradoOS.exe --diagnose-gui exited with $($proc.ExitCode)" }

          $iscc = (Get-Command iscc -ErrorAction SilentlyContinue).Source
          if (-not $iscc -and (Test-Path "C:\Program Files (x86)\Inno Setup 6\ISCC.exe")) {
            $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          }
          if (-not $iscc) {
            choco install innosetup -y
            $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          }
          & $iscc "/DMyAppVersion=0.2.0" "packaging/windows_installer.iss"
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup ISCC.exe failed with exit code $LASTEXITCODE" }
          if (-not (Test-Path "dist/PradoOS-Setup.exe")) { throw "Missing dist/PradoOS-Setup.exe" }
          Write-Host "Built Windows installer: $((Get-Item 'dist/PradoOS-Setup.exe').Length) bytes"

      - name: Upload Windows GUI Diagnostic Report
        if: always() && runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: windows-gui-diagnostics
          path: dist/win_gui_diag.json
          if-no-files-found: ignore

      - name: Package Linux release archive
        if: runner.os == 'Linux'
        shell: bash
        run: |
          if [ -d "dist/PradoOS" ]; then
            tar -czf dist/PradoOS-linux.tar.gz -C dist PradoOS
          elif [ -f "dist/PradoOS" ]; then
            tar -czf dist/PradoOS-linux.tar.gz -C dist PradoOS
          fi

      - name: Upload Release Asset to GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'release'
        with:
          files: ${{ matrix.artifact_path }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Build Artifact (for workflow_dispatch)
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_path }}
          if-no-files-found: ignore
